<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My YouTube</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true"><span></span></div>
        <div>
          <h1>My YouTube</h1>
          <p>Playback, your way.</p>
        </div>
      </header>

      <section aria-label="Playback defaults">
        <label class="toggle-row" for="progressBarEnabled">
          <span>
            <strong>Progress bar</strong>
            <small>Visible while video controls are hidden</small>
          </span>
          <span class="switch">
            <input id="progressBarEnabled" type="checkbox" />
            <span aria-hidden="true"></span>
          </span>
        </label>

        <label class="field" for="defaultPlaybackRate">
          <span>Default speed</span>
          <select id="defaultPlaybackRate">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1">Normal (1×)</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
          </select>
        </label>

        <label class="field" for="defaultQuality">
          <span>Default quality</span>
          <select id="defaultQuality">
            <option value="auto">Auto</option>
            <option value="144">144p</option>
            <option value="240">240p</option>
            <option value="360">360p</option>
            <option value="480">480p</option>
            <option value="720">720p HD</option>
            <option value="1080">1080p HD</option>
            <option value="1440">1440p HD</option>
            <option value="2160">2160p 4K</option>
            <option value="4320">4320p 8K</option>
          </select>
          <small class="note">Uses the closest lower quality when needed.</small>
        </label>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <script src="src/core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
